version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-tools:
        dependency-type: development
    ignore:
      # @astrojs/check pins its TypeScript peer range; bump TS together with it by hand
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: image
    ignore:
      # stay on the Node LTS line that .nvmrc uses; move both together by hand
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # odd nginx minors (1.31, 1.33, …) are mainline; take patches, jump stable lines by hand
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
