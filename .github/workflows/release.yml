name: Release

# A release tag vX.Y.Z publishes, in this order:
#   1. image  ghcr.io/<owner>/<repo>:X.Y.Z (+ X.Y, X, latest)
#   2. chart  oci://ghcr.io/<owner>/charts/<repo> version X.Y.Z, appVersion X.Y.Z (runs image X.Y.Z)
# Pull requests only build the image to prove the Dockerfile still works; nothing is pushed.
on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest (latest follows the newest release tag)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    # only after the image exists, so a published chart never points at a missing image
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Package chart ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint --strict charts/ollyweb
          helm package charts/ollyweb --version "$VERSION" --app-version "$VERSION"

      - name: Push to ghcr.io (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "ollyweb-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github-release:
    # the release page is created last, once the image and the chart it lists really exist
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          CHART: oci://ghcr.io/${{ github.repository_owner }}/charts/ollyweb
        run: |
          VERSION="${TAG#v}"
          cat > notes.md <<'NOTES'
          ## Artifacts

          | | |
          |---|---|
          | Image | `__IMAGE__:__VERSION__` |
          | Helm chart | `__CHART__` version `__VERSION__` |

          ```sh
          helm upgrade --install ollyweb __CHART__ --version __VERSION__ \
            -n ollyverse -f values-prod.yaml --wait
          ```
          NOTES
          sed -i "s|__IMAGE__|$IMAGE|g; s|__CHART__|$CHART|g; s|__VERSION__|$VERSION|g" notes.md

          # v1.2.3-rc.1 and friends are marked as pre-releases
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes.md --generate-notes $PRE
