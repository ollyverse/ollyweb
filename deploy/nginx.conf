server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off; # /sk -> /sk/ must not leak the internal :8080

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Astro puts hashed bundles here, safe to cache forever
    location /_astro/ {
        expires max;
        try_files $uri =404;
    }

    # /sk -> /sk/index.html, /about -> /about.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
